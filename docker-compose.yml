services:
  # 1. Database Service (MySQL)
  mysql-db:
    image: mysql:8.0
    container_name: mysql-service
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=project_module5
      - MYSQL_ROOT_PASSWORD=12345678
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Java Web Service Application
  java-app:
    build: .
    container_name: java-web-service
    ports:
      - "8080:8080"
    environment:
      # Ghi đè cấu hình để App kết nối được tới DB bên trong Docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/project_module5?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
    depends_on:
      - mysql-db

volumes:
  mysql_data: